apiVersion: v1
kind: Namespace
metadata:
  name: security-lab
  labels:
    app.kubernetes.io/part-of: security-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-lab-agent
  namespace: security-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: security-lab-agent-credentials
  namespace: security-lab
type: Opaque
stringData:
  agent-token: "agt_sec_replace_with_enrollment_token"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-lab-agent-config
  namespace: security-lab
data:
  CONTROLLER_URL: "https://cloud.securitylab.internal"
  AGENT_NAME: "k8s-cluster-agent"
  AGENT_TAGS: "k8s,vpc-internal,staging,on-premise"
  AGENT_CAPABILITIES: "native-http,auth-audit,declarative-dsl,docker-sandbox"
  POLL_INTERVAL_MS: "3000"
  HEARTBEAT_INTERVAL_MS: "10000"
  MAX_CONCURRENT_JOBS: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-lab-agent
  namespace: security-lab
  labels:
    app.kubernetes.io/name: security-lab-agent
    app.kubernetes.io/component: execution-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: security-lab-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-lab-agent
    spec:
      serviceAccountName: security-lab-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: agent
          image: ghcr.io/kavicastelo/security-lab-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SECURITY_LAB_CONTROLLER_URL
              valueFrom:
                configMapKeyRef:
                  name: security-lab-agent-config
                  key: CONTROLLER_URL
            - name: SECURITY_LAB_AGENT_NAME
              valueFrom:
                configMapKeyRef:
                  name: security-lab-agent-config
                  key: AGENT_NAME
            - name: SECURITY_LAB_AGENT_TAGS
              valueFrom:
                configMapKeyRef:
                  name: security-lab-agent-config
                  key: AGENT_TAGS
            - name: SECURITY_LAB_AGENT_CAPABILITIES
              valueFrom:
                configMapKeyRef:
                  name: security-lab-agent-config
                  key: AGENT_CAPABILITIES
            - name: SECURITY_LAB_AGENT_POLL_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: security-lab-agent-config
                  key: POLL_INTERVAL_MS
            - name: SECURITY_LAB_AGENT_HEARTBEAT_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: security-lab-agent-config
                  key: HEARTBEAT_INTERVAL_MS
            - name: SECURITY_LAB_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: security-lab-agent-credentials
                  key: agent-token
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Mount Docker socket if containerized scanning (Class B/C) is enabled
            - name: docker-socket
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: tmp-dir
          emptyDir: {}
